name: Semantic naming diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture report
        shell: bash
        run: |
          mkdir -p .artifacts
          set +e
          npm run validate:semantic-naming > .artifacts/report.log 2>&1
          status=$?
          cat .artifacts/report.log
          exit "$status"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-naming-report-${{ github.run_id }}
          path: .artifacts/report.log
          retention-days: 3
