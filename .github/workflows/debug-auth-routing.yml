name: Debug auth routing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm ci
      - name: Run application tests
        id: tests
        continue-on-error: true
        run: npm run test:application-foundation 2>&1 | tee application-tests.log
      - name: Upload application test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-auth-routing-${{ github.run_id }}
          path: application-tests.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        if: steps.tests.outcome == 'failure'
        run: exit 1
