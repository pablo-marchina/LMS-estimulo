name: Export source temporary

on:
  push:
    branches:
      - fix/admin-interface-completeness
    paths:
      - .github/workflows/export-source-temporary.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive source
        shell: bash
        run: git archive --format=zip --output="$RUNNER_TEMP/lms-estimulo-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: lms-estimulo-source
          path: ${{ runner.temp }}/lms-estimulo-source.zip
          retention-days: 1
