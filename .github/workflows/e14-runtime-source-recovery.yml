name: E14 runtime source recovery

on:
  pull_request:
    paths:
      - "scripts/e14/runtime-source-recovery/**"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/e14-runtime-source-recovery.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/e14/runtime-source-recovery/**"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/e14-runtime-source-recovery.yml"

permissions:
  contents: read

concurrency:
  group: e14-runtime-source-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test deterministic recovery tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run synthetic materialization tests
        run: node --test scripts/e14/runtime-source-recovery/materialize-migration-history.test.mjs

      - id: compare_m14
        name: Compare local M14 application read surfaces
        continue-on-error: true
        run: >-
          node --test
          --test-name-pattern="20260709183504"
          scripts/e14/runtime-source-recovery/compare-local-m14.test.mjs

      - id: compare_m14b
        name: Compare local M14b operator workspace
        continue-on-error: true
        run: >-
          node --test
          --test-name-pattern="20260709184749"
          scripts/e14/runtime-source-recovery/compare-local-m14.test.mjs

      - name: Confirm raw exports stay ignored
        shell: bash
        run: |
          set -euo pipefail
          test -f .gitignore
          grep -Fx '**/*.local.jsonl' .gitignore
          grep -Fx '.artifacts/' .gitignore

      - name: Enforce remote M14 equivalence
        if: always()
        env:
          M14_OUTCOME: ${{ steps.compare_m14.outcome }}
          M14B_OUTCOME: ${{ steps.compare_m14b.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$M14_OUTCOME" != "success" || "$M14B_OUTCOME" != "success" ]]; then
            echo "M14 outcome: $M14_OUTCOME"
            echo "M14b outcome: $M14B_OUTCOME"
            echo "Local M14 files must be replaced by content recovered from the remote history."
            exit 1
          fi
