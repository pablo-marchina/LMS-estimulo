name: Fix activity hash expression temporary

on:
  push:
    branches:
      - fix/platform-content-progress-certificates
    paths:
      - .github/workflows/fix-activity-hash-expression-temporary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use the canonical activity hash function
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260731180000_admin_delivery_and_journey_corrections.sql')
          content = path.read_text()
          old = "content_hash=encode(digest(payload::text||'|'||(coalesce(configuration,'{}'::jsonb)-'content_sections'-'prompts')::text,'sha256'),'hex')"
          new = "content_hash=app_private.e14_request_hash(coalesce(configuration,'{}'::jsonb)-'content_sections'-'prompts')"
          if content.count(old) != 1:
              raise SystemExit(f'expected exactly one invalid activity hash expression, found {content.count(old)}')
          path.write_text(content.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-activity-hash-expression-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260731180000_admin_delivery_and_journey_corrections.sql
          git commit -m "fix(database): use canonical activity configuration hash"
          git push origin HEAD:fix/platform-content-progress-certificates
