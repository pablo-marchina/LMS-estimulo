name: Apply definitive platform changes

on:
  push:
    branches:
      - fix/platform-content-progress-certificates
    paths:
      - .github/changes/definitive-platform.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'stage definitive platform patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/changes/definitive-platform.patch.gz.b64 | gzip --decompress > /tmp/definitive-platform.patch
          git apply --check /tmp/definitive-platform.patch
          git apply --index --whitespace=error-all /tmp/definitive-platform.patch
          git rm .github/changes/definitive-platform.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(platform): apply definitive content and progress corrections"
          git push origin HEAD:fix/platform-content-progress-certificates
