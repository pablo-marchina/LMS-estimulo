name: Frontend experience validation

on:
  push:
    branches:
      - refactor/web-frontend-rebuild
  pull_request:
    branches:
      - main

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      CPF_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CPF_LOOKUP_HMAC_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run experience regressions
        run: npm --workspace @estimulo/web run prebuild
      - name: Typecheck
        run: npm run typecheck:web
      - name: Production build
        run: npm run build:web
