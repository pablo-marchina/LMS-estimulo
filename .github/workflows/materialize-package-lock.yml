name: Materialize package lock

on:
  pull_request:
    paths:
      - ".github/workflows/materialize-package-lock.yml"
      - ".npmrc"
      - "package.json"
      - "apps/*/package.json"

permissions:
  contents: write

concurrency:
  group: materialize-package-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Confirm npm version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(npm --version)" == "10.9.2" ]]

      - name: Generate portable lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(deps): materialize canonical npm lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
