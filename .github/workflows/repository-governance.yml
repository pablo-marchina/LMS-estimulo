name: Repository governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  governance:
    name: Validate repository governance
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          standard='^(feat|fix|docs|refactor|test|ci|chore|security|hotfix|perf|build)/[a-z0-9]+(-[a-z0-9]+)*$'
          release='^release/[0-9]{4}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$'
          dependabot='^dependabot/(npm_and_yarn|github_actions)/[A-Za-z0-9._/-]+$'
          if [[ ! "$BRANCH_NAME" =~ $standard && ! "$BRANCH_NAME" =~ $release && ! "$BRANCH_NAME" =~ $dependabot ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            exit 1
          fi

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|refactor|test|ci|chore|security|perf|build|release)(\([a-z0-9-]+\))?(!)?: .{10,}$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Invalid pull request title: $PR_TITLE"
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate new canonical file names
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          invalid=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            filename="${path##*/}"
            if [[ "$path" == docs/*.md || "$path" == docs/**/*.md ]]; then
              doc_pattern='^([A-Z0-9]+(_[A-Z0-9]+)*|ADR-[0-9]{3}-[A-Z0-9]+(-[A-Z0-9]+)*)\.md$'
              if [[ ! "$filename" =~ $doc_pattern ]]; then
                echo "Invalid canonical documentation filename: $path"
                invalid=1
              fi
            fi
            if [[ "$path" == supabase/migrations/*.sql || "$path" == supabase/pending-migrations/*.sql ]]; then
              migration_pattern='^[0-9]{14}_[a-z0-9]+(_[a-z0-9]+)*\.sql$'
              if [[ ! "$filename" =~ $migration_pattern ]]; then
                echo "Invalid migration filename: $path"
                invalid=1
              fi
            fi
          done < <(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA")
          [[ "$invalid" -eq 0 ]]

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"

      - name: Scan complete Git history for secrets
        id: secret-scan
        continue-on-error: true
        run: npm run scan:secrets

      - name: Preserve safe secret-scan metadata
        if: always() && steps.secret-scan.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-safe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/gitleaks-safe.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 5
          compression-level: 9

      - name: Prove secret scanner fails closed
        run: npm run test:secret-scanning

      - name: Validate dependency and runtime integrity
        run: |
          npm run validate:dependency-lock
          npm run validate:runtime-hardening
          npm run validate:repository

      - name: Test repository tooling
        run: npm run test:repository-tooling

      - name: Validate migration history
        run: npm run validate:migration-history

      - name: Validate legacy RPC containment
        run: npm run validate:legacy-rpc-containment

      - name: Confirm local artifacts and archives remain ignored
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx '**/*.local.jsonl' .gitignore
          grep -Fx '.artifacts/' .gitignore
          grep -Fx '*.zip' .gitignore
          grep -Fx '*.tar.gz' .gitignore

      - name: Enforce secret-scan result
        if: steps.secret-scan.outcome == 'failure'
        shell: bash
        run: |
          echo "Secret scanning found historical or current findings. Review the redacted metadata artifact."
          exit 1
