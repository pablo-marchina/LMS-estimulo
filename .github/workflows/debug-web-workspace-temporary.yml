name: Debug web workspace temporary

on:
  push:
    branches:
      - fix/platform-content-progress-certificates
    paths:
      - .github/workflows/debug-web-workspace-temporary.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run validate:dependency-lock
      - run: npm run lint:source
      - run: |
          npm run validate:repository
          npm run validate:application-foundation
          npm run validate:platform-contract
          npm run validate:runtime-hardening
      - run: npm run test:application
      - run: npm run test:product
      - run: npm run test:integrations
      - name: Inspect mutations
        if: always()
        shell: bash
        run: |
          git status --short | tee /tmp/git-status.txt
          find apps/web -type f | sort > /tmp/web-files.txt
          grep -R "thumbnail_path\|thumbnailPath" -n apps/web > /tmp/thumbnail-hits.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-workspace-after-tests
          path: |
            apps/web
            /tmp/git-status.txt
            /tmp/web-files.txt
            /tmp/thumbnail-hits.txt
          retention-days: 1
