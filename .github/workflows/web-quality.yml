name: Web quality

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/application/**"
      - "supabase/functions/authenticated-rpc/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-quality.yml"
  push:
    branches:
      - main
      - fix/participant-profile-navigation
    paths:
      - "apps/web/**"
      - "scripts/application/**"
      - "supabase/functions/authenticated-rpc/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck:web
      - name: Application regression tests
        run: npm run test:application-foundation
