name: Debug repository tooling temporary

on:
  push:
    branches:
      - fix/platform-content-progress-certificates
    paths:
      - .github/workflows/debug-repository-tooling-temporary.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Run repository tooling tests
        shell: bash
        run: npm run test:repository-tooling 2>&1 | tee /tmp/repository-tooling-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-tooling-output
          path: /tmp/repository-tooling-output.txt
          retention-days: 1
