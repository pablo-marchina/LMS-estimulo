name: Temporary source snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    name: Archive tracked source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive tracked files only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/lms-estimulo-source.tar.gz" HEAD

      - name: Upload private source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lms-estimulo-source-${{ github.sha }}
          path: ${{ runner.temp }}/lms-estimulo-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
