name: Apply semantic repository naming with diagnostics

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'refactor/neutral-repository-naming'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply transformation and push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          exec > >(tee .artifacts/semantic-naming-apply.log) 2>&1
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-semantic-naming.yml').read_text(encoding='utf-8')
          start = workflow.index("          from pathlib import Path\n")
          end = workflow.index("          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/semantic-naming-transform.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/semantic-naming-transform.py
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(repository): replace phase-based artifact names"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload apply log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-naming-apply-${{ github.run_id }}
          path: .artifacts/semantic-naming-apply.log
          if-no-files-found: warn
          retention-days: 3
