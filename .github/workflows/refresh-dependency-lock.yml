name: Refresh dependency lock

on:
  pull_request:
    paths:
      - "package.json"
      - "apps/*/package.json"
      - "package-lock.json"
      - ".github/workflows/refresh-dependency-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-dependency-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/2026-07-final'
    name: Generate exact npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"

      - name: Generate and audit lockfile from clean state
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = "10.9.8"
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all
          npm audit --omit=dev

      - name: Commit audited lockfile and remove temporary workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-dependency-lock.yml
          git diff --cached --check
          git commit -m "fix(deps): refresh audited dependency lock"
          git push origin "HEAD:${HEAD_BRANCH}"
