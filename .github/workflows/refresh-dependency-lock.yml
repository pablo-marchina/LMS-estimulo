name: Refresh dependency lock

on:
  pull_request:
    paths:
      - "package.json"
      - "apps/*/package.json"
      - "package-lock.json"
      - ".github/workflows/refresh-dependency-lock.yml"

permissions:
  contents: read

concurrency:
  group: refresh-dependency-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate exact npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"

      - name: Generate and verify lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version)" = "10.9.8"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --all
          npm audit --omit=dev

      - name: Upload generated lockfile
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: generated-package-lock-${{ github.event.pull_request.head.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 2
