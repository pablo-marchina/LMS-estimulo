name: Browser E2E

on:
  pull_request:
    paths:
      - ".github/workflows/browser-e2e.yml"
      - ".env.example"
      - "apps/web/**"
      - "scripts/browser-e2e/**"
      - "scripts/runtime/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-vertical:
    name: Synthetic participant vertical
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      BROWSER_E2E_MODE: synthetic
      BROWSER_E2E_TOKEN: local-browser-e2e-token-2026-only
      BROWSER_E2E_STATE_FILE: /tmp/estimulo-browser-e2e-state.json
      BROWSER_E2E_STORAGE_DIR: /tmp/estimulo-browser-e2e-storage
      BROWSER_E2E_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: browser-e2e-anon-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: browser-e2e-service-role-key
      AUTHENTICATED_RPC_FUNCTION_URL: http://127.0.0.1:54321/functions/v1/authenticated-rpc
      CPF_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CPF_LOOKUP_HMAC_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Confirm Chrome
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version

      - name: Build web application
        run: npm run build:web

      - name: Reset synthetic state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BROWSER_E2E_STATE_FILE" "$BROWSER_E2E_STORAGE_DIR" .artifacts/browser-e2e
          mkdir -p .artifacts/browser-e2e

      - name: Start web server
        shell: bash
        run: |
          set -euo pipefail
          npm --workspace @estimulo/web run start -- --hostname 127.0.0.1 --port 3000 > .artifacts/browser-e2e/server.log 2>&1 &
          echo $! > .artifacts/browser-e2e/server.pid

      - name: Run synthetic browser vertical
        run: npm run test:browser-e2e

      - name: Stop web server
        if: always()
        shell: bash
        run: |
          if [[ -f .artifacts/browser-e2e/server.pid ]]; then
            kill "$(cat .artifacts/browser-e2e/server.pid)" 2>/dev/null || true
          fi

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/browser-e2e
          if-no-files-found: warn
          retention-days: 5
          compression-level: 9
