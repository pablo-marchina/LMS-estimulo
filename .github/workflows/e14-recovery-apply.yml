name: Temporary E14 history recovery

on:
  push:
    branches:
      - fix/recover-e14-runtime-history
    paths:
      - .github/workflows/e14-recovery-apply.yml

permissions:
  contents: write

jobs:
  materialize:
    name: Materialize exact remote history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download authorized read-only export
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://cfpfeavjlgheqqiaqtzv.supabase.co/functions/v1/e14-migration-export?nonce=b1afJPtFsLZjUY23dnlzTD4WYz5W4nrC6sO6dmHGC60' \
            --output /tmp/e14-runtime-export.json

      - name: Validate and split exact ranges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('/tmp/e14-runtime-export.json').read_text(encoding='utf-8'))
          assert source['schema_version'] == '1.0'
          assert source['source'] == 'supabase_migrations.schema_migrations'
          assert source['project_ref'] == 'cfpfeavjlgheqqiaqtzv'
          rows = source['rows']
          assert len(rows) == 167
          versions = [row['version'] for row in rows]
          assert versions == sorted(versions)
          assert len(set(versions)) == 167

          m13 = [row for row in rows if '20260709051056' <= row['version'] <= '20260709060330']
          m14 = [row for row in rows if '20260709183504' <= row['version'] <= '20260709184749']
          assert len(m13) == 165
          assert len(m14) == 2

          for path, selected in [('/tmp/m13.jsonl', m13), ('/tmp/m14.jsonl', m14)]:
              Path(path).write_text(
                  ''.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n' for row in selected),
                  encoding='utf-8',
              )
          PY

      - name: Materialize M13 and M14
        shell: bash
        run: |
          set -euo pipefail
          node scripts/e14/runtime-source-recovery/materialize-migration-history.mjs \
            --input /tmp/m13.jsonl \
            --migrations-dir supabase/migrations \
            --canonical-file supabase/canonical-migrations/20260709051056_m13_e14_runtime_canonical.sql \
            --manifest supabase/canonical-migrations/M13_RUNTIME_MANIFEST.json \
            --from-version 20260709051056 \
            --to-version 20260709060330
          node scripts/e14/runtime-source-recovery/materialize-migration-history.mjs \
            --input /tmp/m14.jsonl \
            --migrations-dir supabase/migrations \
            --canonical-file supabase/canonical-migrations/20260709183504_m14_application_canonical.sql \
            --manifest supabase/canonical-migrations/M14_RUNTIME_MANIFEST.json \
            --from-version 20260709183504 \
            --to-version 20260709184749

      - name: Validate recovered inventories
        shell: bash
        run: |
          set -euo pipefail
          node scripts/e14/runtime-source-recovery/validate-recovered-history.mjs \
            --manifest supabase/canonical-migrations/M13_RUNTIME_MANIFEST.json \
            --migrations-dir supabase/migrations \
            --canonical-file supabase/canonical-migrations/20260709051056_m13_e14_runtime_canonical.sql
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('supabase/canonical-migrations/M14_RUNTIME_MANIFEST.json', 'utf8'));
          const expected = [
            ['20260709183504', 'm14_step5_application_read_surfaces', 10164, '464263feab785f9ae35d95ad89c215e9794f473e89f5d7d36a0f1c371d1c328d'],
            ['20260709184749', 'm14b_step5_operator_workspace', 1881, '9b4b9b387778ee174c01aaf700d638e6df157065a167c585624e8a1ad3e1fe69'],
          ];
          if (manifest.migration_count !== 2) throw new Error('unexpected M14 count');
          for (const [version, name, bytes, hash] of expected) {
            const item = manifest.migrations.find((candidate) => candidate.version === version);
            if (!item || item.name !== name || item.remote_sql_bytes !== bytes || item.remote_sql_sha256 !== hash) {
              throw new Error(`unexpected M14 inventory for ${version}`);
            }
          }
          const fingerprint = createHash('sha256').update(
            manifest.migrations.map((item) => `${item.version}:${item.remote_sql_sha256}`).join('\n'),
          ).digest('hex');
          if (fingerprint !== '8b3cb9b361f2bbff69d784ef92767de14795f761c1159321e8b163ccde96fde0') {
            throw new Error('unexpected M14 fingerprint');
          }
          NODE

      - name: Remove divergent and temporary recovery sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f supabase/migrations/20260709183000_m14_step5_application_read_surfaces.sql
          rm -f supabase/migrations/20260709184500_m14b_step5_operator_workspace.sql
          rm -f .github/workflows/e14-runtime-history-export.yml
          rm -f scripts/e14/runtime-source-recovery/export-migration-history.sql
          rm -f .github/workflows/e14-recovery-apply.yml

      - name: Commit materialized history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(database): recover exact E14 migration history'
          git push origin HEAD:fix/recover-e14-runtime-history
