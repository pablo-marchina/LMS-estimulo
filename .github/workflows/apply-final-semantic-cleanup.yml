name: Apply final semantic cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'refactor/neutral-repository-naming'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rename active symbols and document headings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_action = Path('apps/web/app/actions/e14.ts')
          new_action = Path('apps/web/app/actions/journey.ts')
          if old_action.exists():
              new_action.parent.mkdir(parents=True, exist_ok=True)
              old_action.rename(new_action)

          replacements = {
              '@/lib/e14/': '@/lib/journey-runtime/',
              '@/app/actions/e14': '@/app/actions/journey',
              'legacyE14RpcArguments': 'legacyRpcArguments',
              'LegacyE14RpcArguments': 'LegacyRpcArguments',
              'E14_RPC_ERROR': 'JOURNEY_RPC_ERROR',
              'export const e14 =': 'export const journeyRuntime =',
              'import { e14, JourneyRpcError }': 'import { journeyRuntime, JourneyRpcError }',
              'import { e14 }': 'import { journeyRuntime }',
              'e14.': 'journeyRuntime.',
              "apps/web/app/actions/e14.ts": "apps/web/app/actions/journey.ts",
              'todos os comandos E14': 'todos os comandos da jornada',
              '# ADR-002 — Rebaseline do E14 pelas premissas atuais': '# ADR-002 — Rebaseline pelas premissas atuais',
              '## Critérios de aceite do E12': '## Critérios de aceite',
              '## 5. Decisões ainda do E12': '## 5. Decisões pendentes',
              '## IR-007 — decisões e evidências para liberar o gate E13': '## IR-007 — decisões e evidências para liberar o gate de segurança',
              '# E14-R1 — fonte, contratos e comportamento do runtime': '# Fonte, contratos e comportamento do runtime',
              '# E14.1 — Passo 5': '# Fundação da aplicação',
              'o E14-B002 permanece aberto': 'o bloqueador `LEGACY-RPC-NAMING` permanece aberto',
              '# E14-R1c — contratos públicos de RPC': '# Contratos públicos de RPC',
              '# E14-R1d — backend E2E reproduzível': '# Backend E2E reproduzível',
              '## 9. Resultado do E08': '## 9. Resultado da modelagem de eventos',
              '## 8. Validação necessária no E12': '## 8. Validação necessária',
              'E14_REBASELINE_EXECUTION_PLAN.md': 'action plan (not versioned)',
          }

          excluded_prefixes = (
              '.git/',
              '.github/workflows/',
              'node_modules/',
              'supabase/migrations/',
              'supabase/canonical-migrations/202',
          )
          allowed_suffixes = {'.ts', '.tsx', '.mts', '.mjs', '.js', '.jsx', '.md', '.json', '.yaml', '.yml'}
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or path.suffix.lower() not in allowed_suffixes:
                  continue
              rel = path.as_posix().removeprefix('./')
              if rel.startswith(excluded_prefixes):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(repository): remove remaining phase-based symbols"
          git push origin "HEAD:${{ github.head_ref }}"
