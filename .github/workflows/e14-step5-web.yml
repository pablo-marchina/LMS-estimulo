name: Web CI

on:
  pull_request:
    paths:
      - ".github/workflows/e14-step5-web.yml"
      - ".npmrc"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/repository/validate-package-lock.mjs"
      - "scripts/e14/validate-step5-app-foundation*"
      - "scripts/e14/hubspot-contracts/**"
      - "scripts/e14/configurable-product/**"
      - "scripts/e14/opaque-helpers/**"
      - "docs/implementation/e14-opaque-helper-baseline-v1.json"
      - "docs/implementation/e14-public-rpc-contracts-v1.json"
      - "supabase/migrations/*_m14*_step5_*.sql"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate web application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Validate dependency lock
        run: npm run validate:dependency-lock

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Confirm lockfile remains unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate application foundation
        run: npm run validate:e14-step5

      - name: Run application foundation tests
        run: npm run test:e14-step5

      - name: Test HubSpot authoritative data contracts
        run: npm run test:e14-hubspot-contracts

      - name: Test configurable product behavior
        run: npm run test:e14-configurable-product

      - name: Test opaque helper containment
        run: npm run test:e14-opaque-helper-containment

      - name: Validate opaque helper containment
        run: npm run validate:e14-opaque-helper-containment

      - name: Typecheck web application
        run: npm run typecheck:web

      - name: Build web application
        run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
