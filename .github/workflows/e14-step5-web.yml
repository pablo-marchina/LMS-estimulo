name: Web CI

on:
  pull_request:
    paths:
      - ".github/workflows/e14-step5-web.yml"
      - "apps/web/**"
      - "package.json"
      - "scripts/e14/validate-step5-app-foundation*"
      - "scripts/e14/hubspot-contracts/**"
      - "supabase/migrations/*_m14*_step5_*.sql"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate web application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate application foundation
        run: npm run validate:e14-step5

      - name: Run application foundation tests
        run: npm run test:e14-step5

      - name: Test HubSpot authoritative data contracts
        run: npm run test:e14-hubspot-contracts

      - name: Typecheck web application
        run: npm run typecheck:web

      - name: Build web application
        run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
