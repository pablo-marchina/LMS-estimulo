name: Review Drive public access

on:
  push:
    branches:
      - fix/final-vanessa-validation

permissions:
  contents: read

jobs:
  validate-drive-video-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          check-latest: false
      - name: Check every official Drive video without Google credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const migrationPath = 'supabase/migrations/20260730150000_openai_official_drive_videos.sql';
          const source = await readFile(migrationPath, 'utf8');
          const ids = [...source.matchAll(/\('[0-9a-f-]{36}'::uuid,\s*\d+,\s*'([A-Za-z0-9_-]{20,})',/gu)].map((match) => match[1]);
          const uniqueIds = [...new Set(ids)];
          if (uniqueIds.length !== 24) throw new Error(`Expected 24 official Drive video IDs, found ${uniqueIds.length}`);

          const failures = [];
          for (const id of uniqueIds) {
            const url = `https://drive.google.com/file/d/${id}/preview`;
            const response = await fetch(url, {
              redirect: 'follow',
              headers: {
                'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
                'accept-language': 'pt-BR,pt;q=0.9,en;q=0.8',
              },
            });
            const finalUrl = response.url;
            const contentType = response.headers.get('content-type') ?? '';
            const text = contentType.includes('text/html') ? await response.text() : '';
            const loginRedirect = /accounts\.google\.com|ServiceLogin|signin\/v2/iu.test(finalUrl);
            const permissionDenied = /you need access|request access|solicitar acesso|access denied|permission denied|não tem acesso|precisa de acesso/iu.test(text);
            const looksLikeDrivePreview = response.ok && !loginRedirect && !permissionDenied && (/drive\.google\.com/iu.test(finalUrl) || /googleusercontent\.com/iu.test(finalUrl));
            console.log(JSON.stringify({ id, status: response.status, finalUrl, contentType, looksLikeDrivePreview }));
            if (!looksLikeDrivePreview) failures.push({ id, status: response.status, finalUrl, contentType, loginRedirect, permissionDenied });
          }

          if (failures.length) {
            console.error(JSON.stringify({ status: 'FAIL', failures }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ status: 'PASS', checked: uniqueIds.length }));
          NODE
