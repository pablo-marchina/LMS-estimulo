name: Temporary lesson preview validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lesson-preview:
    name: Validate restored lesson on current preview
    if: github.head_ref == 'fix/lesson-screen'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_TARGET_URL: https://lms-estimulo-jxux73uq5-pablo-marchinas-projects.vercel.app
      E2E_PARTICIPANT_EMAIL: ${{ secrets.E2E_PARTICIPANT_EMAIL }}
      E2E_PARTICIPANT_PASSWORD: ${{ secrets.E2E_PARTICIPANT_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install Playwright without changing lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate required E2E credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in E2E_TARGET_URL E2E_PARTICIPANT_EMAIL E2E_PARTICIPANT_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required E2E input: $name" >&2
              exit 1
            fi
          done
      - name: Run dedicated lesson visual and functional gate
        run: node --import ./scripts/e2e/vercel-protection-bypass.mjs scripts/e2e/participant-critical-flow-visual.mjs
      - name: Upload lesson screenshots and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: temporary-restored-lesson-preview-${{ github.run_id }}
          path: artifacts/e2e-critical-flow
          if-no-files-found: error
          retention-days: 2
