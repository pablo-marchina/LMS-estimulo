name: Semantic reference inventory

on:
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inventory active phase references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          {
            echo '## paths'
            find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -print | sort | grep -Ei '(^|/)(e[0-9]{2})([._/-]|$)' || true
            echo '## application references'
            grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.mjs' '(@/lib/e[0-9]{2}/|actions/e[0-9]{2}|\blegacyE[0-9]{2}|\bE[0-9]{2}[A-Za-z_]|\bconst e[0-9]{2}\b|\bexport const e[0-9]{2}\b)' apps scripts || true
            echo '## documentation headings and blocker ids'
            grep -RInE --include='*.md' '^(#{1,6} .*\bE[0-9]{2}\b|.*\bE[0-9]{2}-B[0-9]+\b|.*E[0-9]{2}_REBASELINE_EXECUTION_PLAN)' docs README.md PROJECT_INDEX.md || true
          } | tee .artifacts/semantic-reference-inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-reference-inventory-${{ github.run_id }}
          path: .artifacts/semantic-reference-inventory.txt
          retention-days: 3
