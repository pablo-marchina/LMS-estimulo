name: One-off new user diagnostic E2E

on:
  push:
    branches:
      - test/new-user-diagnostic-e2e-run-20260824-b
    paths:
      - .github/workflows/new-user-diagnostic-e2e.yml
      - scripts/e2e/participant-critical-flow-visual.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/new-user-diagnostic-e2e.yml
      - scripts/e2e/participant-critical-flow-visual.mjs

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_TARGET_URL: ${{ secrets.E2E_PRODUCTION_URL || 'https://lms-estimulo-web.vercel.app' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run real new-user diagnostic flow
        run: node --import ./scripts/e2e/vercel-protection-bypass.mjs scripts/e2e/participant-critical-flow-visual.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: new-user-diagnostic-e2e-${{ github.run_id }}
          path: artifacts/e2e-critical-flow
          if-no-files-found: error
          retention-days: 3
