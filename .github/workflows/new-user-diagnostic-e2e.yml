name: One-off new user diagnostic E2E

on:
  push:
    branches:
      - test/new-user-diagnostic-e2e-run-20260824-b
    paths:
      - .github/workflows/new-user-diagnostic-e2e.yml

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_TARGET_URL: ${{ secrets.E2E_PRODUCTION_URL || 'https://lms-estimulo-web.vercel.app' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run real new-user diagnostic flow
        shell: bash
        run: |
          mkdir -p artifacts/e2e-new-user
          cat > /tmp/new-user-diagnostic-e2e.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const base = (process.env.E2E_TARGET_URL || '').replace(/\/$/, '');
          if (!base) throw new Error('E2E_TARGET_URL missing');
          const runId = process.env.GITHUB_RUN_ID;
          const email = `pablomarchina+estimulo-e2e-${runId}@gmail.com`;
          const password = `EsT!mulo-${runId}-Q7x9`;
          const artifactDir = 'artifacts/e2e-new-user';

          function cpfFromSeed(seed) {
            let digits = String(seed).replace(/\D/g, '').slice(-9).padStart(9, '7').split('').map(Number);
            if (new Set(digits).size === 1) digits[0] = (digits[0] + 1) % 10;
            const calc = (arr, start) => {
              let sum = 0;
              for (let i = 0; i < arr.length; i++) sum += arr[i] * (start - i);
              const mod = (sum * 10) % 11;
              return mod === 10 ? 0 : mod;
            };
            const d1 = calc(digits, 10);
            const d2 = calc([...digits, d1], 11);
            return [...digits, d1, d2].join('');
          }

          const cpf = cpfFromSeed(runId);
          const phone = '11900000000';
          const answers = [
            'Nunca',
            'Uso para despesas pessoais ou para pagar dívidas',
            'Ainda não faço nenhum controle financeiro',
            'Não teve jeito, acabei atrasando várias contas',
            'Compro e passo no cartão ou uso o cheque especial',
            'Ainda não',
            'O negócio praticamente pararia',
            'Vender, produzir ou entregar meu produto ou serviço',
            'Meu foco é aprender a organizar melhor o negócio',
          ];

          const report = { runId, email, cpf, startedAt: new Date().toISOString(), steps: [] };
          const record = (name, data = {}) => {
            report.steps.push({ name, at: new Date().toISOString(), ...data });
            fs.writeFileSync(`${artifactDir}/report.json`, JSON.stringify(report, null, 2));
            console.log(`E2E_STEP ${name} ${JSON.stringify(data)}`);
          };

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });
          const page = await context.newPage();
          page.setDefaultTimeout(30000);

          try {
            await page.goto(`${base}/cadastro`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.getByLabel('Seu nome').fill('Teste E2E Diagnóstico');
            await page.getByLabel('E-mail').fill(email);
            await page.getByLabel('Senha', { exact: true }).fill(password);
            await page.getByLabel('Confirmar senha').fill(password);
            await page.getByRole('checkbox').check();
            await page.getByRole('button', { name: 'Criar minha conta' }).click();
            await page.waitForLoadState('domcontentloaded');
            await page.screenshot({ path: `${artifactDir}/01-signup-result.png`, fullPage: true });
            record('signup_submitted', { url: page.url() });

            if (!page.url().includes('/cadastro/concluir')) {
              if (!page.url().includes('/entrar')) throw new Error(`Unexpected signup destination: ${page.url()}`);
              fs.writeFileSync(`${artifactDir}/awaiting-confirmation.txt`, email + '\n');
              console.log(`E2E_AWAITING_EMAIL_CONFIRMATION ${email}`);

              let confirmed = false;
              for (let attempt = 1; attempt <= 120; attempt++) {
                await page.goto(`${base}/entrar`, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.getByLabel('E-mail').fill(email);
                await page.getByLabel('Senha').fill(password);
                await page.getByRole('button', { name: 'Entrar', exact: true }).click();
                await page.waitForLoadState('domcontentloaded').catch(() => {});
                if (!page.url().includes('/entrar')) {
                  confirmed = true;
                  record('email_confirmed_and_login_succeeded', { attempt, url: page.url() });
                  break;
                }
                await page.waitForTimeout(5000);
              }
              if (!confirmed) throw new Error('Email confirmation was not completed within the E2E window');
            } else {
              record('signup_created_session', { url: page.url() });
            }

            if (!page.url().includes('/cadastro/concluir')) {
              await page.goto(`${base}/cadastro/concluir`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            }
            await page.getByLabel('Seu nome').fill('Teste E2E Diagnóstico');
            await page.getByLabel('CPF').fill(cpf);
            await page.getByLabel(/telefone/i).fill(phone);
            await page.getByRole('button', { name: 'Entrar na plataforma' }).click();
            await page.waitForURL(/\/empreendedor(?:\?|$)/, { timeout: 60000 });
            await page.screenshot({ path: `${artifactDir}/02-participant-home.png`, fullPage: true });
            record('profile_completed', { url: page.url() });

            const diagButton = page.getByRole('button', { name: /Fazer diagnóstico|Continuar diagnóstico/ });
            await diagButton.waitFor({ state: 'visible', timeout: 60000 });
            await diagButton.click();
            await page.waitForURL(/\/empreendedor\/diagnostico/, { timeout: 60000 });
            record('diagnostic_opened', { url: page.url() });

            for (let i = 0; i < answers.length; i++) {
              const answer = answers[i];
              const radio = page.getByRole('radio', { name: answer, exact: true });
              await radio.waitFor({ state: 'visible', timeout: 30000 });
              await radio.check();
              record(`answer_${i + 1}`, { answer });
              if (i < answers.length - 1) {
                await page.getByText(`Pergunta ${i + 2} de ${answers.length}`).waitFor({ state: 'visible', timeout: 30000 });
              }
            }

            const submit = page.getByRole('button', { name: 'Enviar respostas e concluir diagnóstico' });
            await submit.waitFor({ state: 'visible', timeout: 30000 });
            await submit.waitFor({ state: 'attached' });
            await page.waitForFunction(() => {
              const buttons = [...document.querySelectorAll('button')];
              const button = buttons.find((item) => item.textContent?.includes('Enviar respostas e concluir diagnóstico'));
              return button && !button.disabled;
            }, null, { timeout: 60000 });
            await submit.click();
            await page.waitForURL(/\/empreendedor\/resultado\?.*diagnostico=concluido/, { timeout: 90000 });
            await page.getByText('Diagnóstico concluído', { exact: true }).waitFor({ state: 'visible', timeout: 60000 });
            await page.getByText('🌱 Fortalecendo a Base', { exact: true }).waitFor({ state: 'visible', timeout: 60000 });
            await page.screenshot({ path: `${artifactDir}/03-diagnostic-result.png`, fullPage: true });

            const bodyText = await page.locator('body').innerText();
            report.finalUrl = page.url();
            report.expectedArchetype = '🌱 Fortalecendo a Base';
            report.resultVisible = bodyText.includes('Diagnóstico concluído') && bodyText.includes('🌱 Fortalecendo a Base');
            report.completedAt = new Date().toISOString();
            record('result_rendered', { finalUrl: report.finalUrl, resultVisible: report.resultVisible, expectedArchetype: report.expectedArchetype });
            if (!report.resultVisible) throw new Error('Expected diagnostic result was not visible');
          } catch (error) {
            report.error = error instanceof Error ? error.stack || error.message : String(error);
            report.failedAt = new Date().toISOString();
            fs.writeFileSync(`${artifactDir}/report.json`, JSON.stringify(report, null, 2));
            await page.screenshot({ path: `${artifactDir}/failure.png`, fullPage: true }).catch(() => {});
            throw error;
          } finally {
            await browser.close();
          }
          NODE
          node --import ./scripts/e2e/vercel-protection-bypass.mjs /tmp/new-user-diagnostic-e2e.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: new-user-diagnostic-e2e-${{ github.run_id }}
          path: artifacts/e2e-new-user
          if-no-files-found: error
          retention-days: 3
