name: Temporary admin local OAuth validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-admin-local-oauth-validation.yml"
      - "apps/web/app/auth/admin/start/route.ts"
      - "apps/web/app/entrar/administracao/page.tsx"
      - "apps/web/lib/http-public-origin.ts"
      - "apps/web/lib/http-public-origin-core.mjs"
      - "scripts/runtime/http-public-origin.test.mjs"
      - "scripts/runtime/validate-platform-contract.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-admin-local-oauth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  PLATFORM_RUNTIME_PROVIDER: supabase
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
  AUTHENTICATED_RPC_FUNCTION_URL: https://example.supabase.co/functions/v1/authenticated-rpc
  CPF_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  CPF_LOOKUP_HMAC_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=

jobs:
  validate:
    name: Validate local admin OAuth fix
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test local callback resolution
        run: node --test scripts/runtime/http-public-origin.test.mjs

      - name: Validate platform origin contract
        run: node scripts/runtime/validate-platform-contract.mjs

      - name: Typecheck web application
        run: npm run typecheck:web

      - name: Build web application
        run: npm run build:web
