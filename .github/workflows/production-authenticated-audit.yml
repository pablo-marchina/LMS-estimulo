name: Production authenticated browser audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-authenticated-audit.yml
      - scripts/e2e/production-authenticated-audit.mjs
      - scripts/e2e/auth-cookie-probe.mjs

permissions:
  contents: read

concurrency:
  group: production-authenticated-browser-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Authenticated production audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_PRODUCTION_URL: ${{ secrets.E2E_PRODUCTION_URL }}
      E2E_PARTICIPANT_EMAIL: ${{ secrets.E2E_PARTICIPANT_EMAIL }}
      E2E_PARTICIPANT_PASSWORD: ${{ secrets.E2E_PARTICIPANT_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Playwright without modifying the lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify required E2E inputs are present
        shell: bash
        run: |
          set -euo pipefail
          for name in E2E_PRODUCTION_URL E2E_PARTICIPANT_EMAIL E2E_PARTICIPANT_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required E2E input: $name" >&2
              exit 1
            fi
          done

      - name: Probe SSR auth cookie persistence
        run: node scripts/e2e/auth-cookie-probe.mjs

      - name: Run authenticated production browser audit
        run: node scripts/e2e/production-authenticated-audit.mjs

      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-authenticated-audit
          path: artifacts/e2e-production
          if-no-files-found: warn
          retention-days: 7
