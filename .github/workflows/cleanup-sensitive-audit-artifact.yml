name: One-time sensitive audit artifact cleanup

on:
  push:
    branches:
      - fix/remaining-functional-audit-20260812
    paths:
      - .github/workflows/cleanup-sensitive-audit-artifact.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete affected audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9167901401"
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          echo "Affected browser audit artifact deleted."
