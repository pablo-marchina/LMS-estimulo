name: Dependency reproducibility

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-reproducibility.yml"
      - ".npmrc"
      - ".node-version"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "apps/*/package.json"
      - "scripts/repository/validate-package-lock.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-reproducibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    name: Clean install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Configure deterministic Git line endings
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm checkout is clean
        shell: bash
        run: git diff --exit-code

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Confirm exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"

      - name: Validate dependency lock
        run: npm run validate:dependency-lock

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate installed dependency tree
        run: npm ls --all

      - name: Confirm source and lockfile remain unchanged
        run: git diff --exit-code

      - name: Typecheck web workspace
        run: npm run typecheck:web
