name: Production visual capture

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional target URL (falls back to E2E_PRODUCTION_URL secret)
        required: false
        type: string
      reference_url:
        description: Optional visual reference URL
        required: false
        default: https://estimulo-polish-studio.lovable.app/
        type: string
  pull_request:
    branches:
      - main
    paths:
      - apps/web/**
      - .github/workflows/production-visual-capture.yml
      - scripts/e2e/production-visual-capture.mjs
      - scripts/e2e/visual-manifest-strict-gate.mjs
      - scripts/e2e/participant-critical-flow-visual.mjs
      - scripts/e2e/admin-critical-flow-visual.mjs
      - scripts/e2e/vercel-protection-bypass.mjs
      - scripts/application/lesson-canonical-flow-visual-contract.test.mjs
      - scripts/application/final-review-remediation.test.mjs

permissions:
  contents: read
  deployments: read

concurrency:
  group: production-visual-capture-${{ github.event_name }}-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate visual capture tooling
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Validate visual auditor syntax
        run: |
          node --check scripts/e2e/production-visual-capture.mjs
          node --check scripts/e2e/visual-manifest-strict-gate.mjs
          node --check scripts/e2e/participant-critical-flow-visual.mjs
          node --check scripts/e2e/admin-critical-flow-visual.mjs
          node --check scripts/e2e/vercel-protection-bypass.mjs

      - name: Validate visual remediation contract
        run: |
          node --test scripts/application/final-review-remediation.test.mjs
          node --test scripts/application/lesson-canonical-flow-visual-contract.test.mjs

  capture:
    name: Capture desktop and mobile visual evidence
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Production aliases and audit identities are target-specific secrets. Preview
      # pull requests resolve the exact successful deployment for their head SHA below.
      E2E_TARGET_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment.environment == 'Production' && secrets.E2E_PRODUCTION_URL || github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || inputs.target_url || secrets.E2E_PRODUCTION_URL }}
      E2E_SOURCE_DEPLOYMENT_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || '' }}
      E2E_TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}
      E2E_TARGET_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || github.event_name == 'deployment_status' && github.event.deployment.environment || 'manual' }}
      E2E_REFERENCE_URL: ${{ inputs.reference_url || 'https://estimulo-polish-studio.lovable.app/' }}
      E2E_PARTICIPANT_EMAIL: ${{ secrets.E2E_PARTICIPANT_EMAIL }}
      E2E_PARTICIPANT_PASSWORD: ${{ secrets.E2E_PARTICIPANT_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_VISUAL_MAX_PAGES: '80'

    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up repository Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Playwright without modifying the lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve pull-request preview deployment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          for attempt in $(seq 1 40); do
            deployment_ids="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/deployments?sha=${PR_HEAD_SHA}&per_page=20" | jq -r '.[].id')"

            for deployment_id in ${deployment_ids}; do
              deployment_url="$(curl -fsSL \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/deployments/${deployment_id}/statuses?per_page=20" | jq -r '[.[] | select(.state == "success" and ((.environment_url // "") | length > 0))][0].environment_url // empty')"
              if [ -n "${deployment_url}" ]; then
                echo "Resolved preview deployment for ${PR_HEAD_SHA}: ${deployment_url}"
                echo "E2E_TARGET_URL=${deployment_url}" >> "${GITHUB_ENV}"
                echo "E2E_SOURCE_DEPLOYMENT_URL=${deployment_url}" >> "${GITHUB_ENV}"
                exit 0
              fi
            done

            echo "Preview deployment is not ready yet (attempt ${attempt}/40)."
            sleep 15
          done

          echo "No successful preview deployment with an environment URL was found for ${PR_HEAD_SHA}." >&2
          exit 1

      - name: Verify required E2E inputs are present
        shell: bash
        run: |
          set -euo pipefail
          for name in E2E_TARGET_URL E2E_PARTICIPANT_EMAIL E2E_PARTICIPANT_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required E2E input: $name" >&2
              exit 1
            fi
          done

      - name: Capture broad visual evidence
        run: node --import ./scripts/e2e/vercel-protection-bypass.mjs scripts/e2e/production-visual-capture.mjs

      - name: Record deployment provenance
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/e2e-visual
          node <<'NODE'
          const fs = require('node:fs');
          const data = {
            targetUrl: process.env.E2E_TARGET_URL,
            sourceDeploymentUrl: process.env.E2E_SOURCE_DEPLOYMENT_URL || null,
            targetSha: process.env.E2E_TARGET_SHA || null,
            targetEnvironment: process.env.E2E_TARGET_ENVIRONMENT || null,
            automationBypassConfigured: Boolean((process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '').trim()),
            workflowRun: process.env.GITHUB_RUN_ID,
            auditedAt: new Date().toISOString(),
          };
          fs.writeFileSync('artifacts/e2e-visual/deployment-provenance.json', `${JSON.stringify(data, null, 2)}\n`);
          NODE

      - name: Enforce strict broad visual coverage
        if: always()
        run: node scripts/e2e/visual-manifest-strict-gate.mjs

      - name: Validate canonical participant flow and composition
        if: always()
        run: node --import ./scripts/e2e/vercel-protection-bypass.mjs scripts/e2e/participant-critical-flow-visual.mjs

      - name: Validate critical admin certificate states
        if: always()
        run: node --import ./scripts/e2e/vercel-protection-bypass.mjs scripts/e2e/admin-critical-flow-visual.mjs

      - name: Publish capture summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/e2e-visual/deployment-provenance.json ]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const provenance = JSON.parse(fs.readFileSync('artifacts/e2e-visual/deployment-provenance.json', 'utf8'));
          console.log('## Deployment provenance');
          console.log('');
          console.log(`- Target: ${provenance.targetUrl}`);
          console.log(`- Source deployment: ${provenance.sourceDeploymentUrl ?? 'manual/canonical'}`);
          console.log(`- Commit: ${provenance.targetSha ?? 'unknown'}`);
          console.log(`- Environment: ${provenance.targetEnvironment ?? 'unknown'}`);
          console.log(`- Vercel automation bypass: ${provenance.automationBypassConfigured ? 'configured' : 'not configured'}`);
          NODE
          fi
          if [ -f artifacts/e2e-visual/visual-manifest.json ]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/e2e-visual/visual-manifest.json', 'utf8'));
          console.log('');
          console.log('## Visual capture');
          console.log('');
          console.log(`- Screenshots: ${report.summary.screenshots}`);
          console.log(`- Failures: ${report.summary.failures}`);
          console.log(`- Warnings: ${report.summary.warnings}`);
          console.log(`- Reference captures: ${report.summary.byRole.reference}`);
          console.log(`- Public captures: ${report.summary.byRole.public}`);
          console.log(`- Participant captures: ${report.summary.byRole.participant}`);
          console.log(`- Admin captures: ${report.summary.byRole.admin}`);
          NODE
          fi
          if [ -f artifacts/e2e-critical-flow/critical-flow-report.json ]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/e2e-critical-flow/critical-flow-report.json', 'utf8'));
          console.log('');
          console.log('## Critical participant flow');
          console.log('');
          console.log(`- Viewports captured: ${report.summary.captures}`);
          console.log(`- Failures: ${report.summary.failures}`);
          for (const capture of report.captures) {
            console.log(`- ${capture.viewport.key}: ${capture.finalRoute} — canvas delta ${capture.metrics.canvasCenterDelta ?? 'n/a'}px`);
          }
          NODE
          fi
          if [ -f artifacts/e2e-admin-critical/admin-critical-report.json ]; then
            node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/e2e-admin-critical/admin-critical-report.json', 'utf8'));
          console.log('');
          console.log('## Critical admin states');
          console.log('');
          console.log(`- Captures: ${report.summary.captures}`);
          console.log(`- Failures: ${report.summary.failures}`);
          NODE
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-visual-capture-${{ github.run_id }}
          path: |
            artifacts/e2e-visual
            artifacts/e2e-critical-flow
            artifacts/e2e-admin-critical
          if-no-files-found: error
          retention-days: 14
