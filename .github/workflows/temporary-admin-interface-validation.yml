name: Temporary admin interface validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-admin-interface-validation.yml"
      - "apps/web/**"
      - "scripts/runtime/admin-interface-oauth-visual.test.mjs"
      - "scripts/runtime/validate-hardening.mjs"
      - "scripts/security/verify-http-hardening.mjs"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-admin-interface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  PLATFORM_RUNTIME_PROVIDER: supabase
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
  AUTHENTICATED_RPC_FUNCTION_URL: https://example.supabase.co/functions/v1/authenticated-rpc
  CPF_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  CPF_LOOKUP_HMAC_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=

jobs:
  validate:
    name: Validate OAuth bridge and visual editor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test OAuth bridge and visual editor contracts
        run: node --test scripts/runtime/admin-interface-oauth-visual.test.mjs scripts/runtime/http-public-origin.test.mjs

      - name: Validate runtime hardening
        run: node scripts/runtime/validate-hardening.mjs

      - name: Typecheck web application
        run: npm run typecheck:web

      - name: Build web application
        run: npm run build:web

      - name: Start standalone application
        run: |
          set -euo pipefail
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -R apps/web/public apps/web/.next/standalone/apps/web/public
          PORT=3000 HOSTNAME=127.0.0.1 node apps/web/.next/standalone/apps/web/server.js > /tmp/estimulo-web.log 2>&1 &
          echo $! > /tmp/estimulo-web.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/entrar/administracao >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/estimulo-web.log
          exit 1

      - name: Verify local OAuth preparation and hosted return
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header /tmp/start.headers --output /dev/null http://127.0.0.1:3000/auth/admin/start
          cat /tmp/start.headers
          grep -Eqi '^location: https://lms-estimulo-web\.vercel\.app/auth/admin/local-bridge/prepare\?return_to=' /tmp/start.headers

          curl --silent --show-error --dump-header /tmp/prepare.headers --output /dev/null 'http://127.0.0.1:3000/auth/admin/local-bridge/prepare?return_to=http%3A%2F%2Flocalhost%3A3000%2Fauth%2Fadmin%2Fcallback'
          cat /tmp/prepare.headers
          grep -Eqi '^location: http://localhost:3000/auth/admin/start\?bridge_ready=1' /tmp/prepare.headers
          grep -Eqi '^set-cookie: estimulo-admin-local-oauth-return=' /tmp/prepare.headers

          RETURN_COOKIE=$(node -e 'process.stdout.write(encodeURIComponent("http://localhost:3000/auth/admin/callback"))')
          curl --silent --show-error --dump-header /tmp/return.headers --output /dev/null --header "Cookie: estimulo-admin-local-oauth-return=${RETURN_COOKIE}" 'http://127.0.0.1:3000/?code=oauth-test-code'
          cat /tmp/return.headers
          grep -Eqi '^location: http://localhost:3000/auth/admin/callback\?code=oauth-test-code' /tmp/return.headers
          grep -Eqi '^set-cookie: estimulo-admin-local-oauth-return=' /tmp/return.headers

      - name: Verify same-origin preview headers
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header /tmp/security.headers --output /dev/null http://127.0.0.1:3000/entrar/administracao
          grep -Eqi '^x-frame-options: SAMEORIGIN' /tmp/security.headers
          grep -Eqi "^content-security-policy: .*frame-ancestors 'self'.*frame-src 'self'" /tmp/security.headers

      - name: Stop standalone application
        if: always()
        run: |
          if [ -f /tmp/estimulo-web.pid ]; then
            kill "$(cat /tmp/estimulo-web.pid)" 2>/dev/null || true
          fi
