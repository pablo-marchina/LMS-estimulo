name: Repository naming audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inventory phase-based names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          excluded_dirs = {'.git', 'node_modules', '.next', '.artifacts'}
          path_pattern = re.compile(r'(^|/)(?:[Ee]\d{2}(?:[_-]|/|$)|(?:scripts|lib)/e\d{2}(?:/|$))')
          content_patterns = [
              re.compile(r'\bE\d{2}(?:-[A-Z]\d+|-[A-Z0-9_-]+)?\b'),
              re.compile(r'\be\d{2}_[a-z0-9_]+\b'),
              re.compile(r'\bE\d{2}_[A-Z0-9_]+\b'),
          ]

          immutable_prefixes = (
              'supabase/migrations/',
              'supabase/canonical-migrations/',
          )

          paths = []
          references = []
          for file in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = file.as_posix().removeprefix('./')
              if any(part in excluded_dirs for part in file.parts):
                  continue
              if path_pattern.search(rel):
                  paths.append({
                      'path': rel,
                      'classification': 'immutable_history_or_contract' if rel.startswith(immutable_prefixes) else 'active_repository_artifact',
                  })
              try:
                  text = file.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for line_number, line in enumerate(text.splitlines(), 1):
                  matches = sorted({m.group(0) for pattern in content_patterns for m in pattern.finditer(line)})
                  if matches:
                      references.append({
                          'path': rel,
                          'line': line_number,
                          'matches': matches,
                          'classification': 'immutable_history_or_contract' if rel.startswith(immutable_prefixes) else 'active_repository_reference',
                      })

          report = {
              'phase_named_paths': paths,
              'phase_named_path_count': len(paths),
              'active_phase_named_path_count': sum(item['classification'] == 'active_repository_artifact' for item in paths),
              'immutable_phase_named_path_count': sum(item['classification'] == 'immutable_history_or_contract' for item in paths),
              'phase_references': references,
              'phase_reference_count': len(references),
          }
          Path('.artifacts/repository-naming-audit.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({k: v for k, v in report.items() if not isinstance(v, list)}, indent=2))
          PY

      - name: Upload naming audit
        uses: actions/upload-artifact@v4
        with:
          name: repository-naming-audit-${{ github.run_id }}
          path: .artifacts/repository-naming-audit.json
          if-no-files-found: error
          retention-days: 3
