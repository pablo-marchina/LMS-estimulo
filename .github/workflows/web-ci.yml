name: Web CI

on:
  pull_request:
    paths:
      - ".github/workflows/web-ci.yml"
      - ".dockerignore"
      - ".env.example"
      - ".npmrc"
      - "Dockerfile.lambda"
      - "apps/web/**"
      - "config/official-diagnostic/**"
      - "config/platform/**"
      - "docs/architecture/**"
      - "docs/decisions/**"
      - "docs/implementation/**"
      - "infra/aws/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/application/**"
      - "scripts/integrations/**"
      - "scripts/product/**"
      - "scripts/repository/validate-package-lock.mjs"
      - "scripts/runtime/**"
      - "scripts/verification/**"
      - "supabase/migrations/*_m14*_step5_*.sql"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_ENV: test
  PLATFORM_RUNTIME_PROVIDER: supabase
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
  AUTHENTICATED_RPC_FUNCTION_URL: https://example.supabase.co/functions/v1/authenticated-rpc
  CPF_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  CPF_LOOKUP_HMAC_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=

jobs:
  validate:
    name: Validate web application
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Validate dependency lock
        run: npm run validate:dependency-lock

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Confirm lockfile remains unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate application foundation
        run: npm run validate:application-foundation

      - name: Validate platform contract
        run: npm run validate:platform-contract

      - name: Test application behavior
        run: npm run test:application

      - name: Test product rules
        run: npm run test:product

      - name: Test integration contracts
        run: npm run test:integrations

      - name: Typecheck web application
        run: npm run typecheck:web

      - name: Build Supabase test application
        run: npm run build:web

      - name: Build AWS Lambda container image
        run: |
          docker buildx build \
            --load \
            --provenance=false \
            --platform linux/amd64 \
            --file Dockerfile.lambda \
            --build-arg NEXT_PUBLIC_APP_URL=https://ci.example.org \
            --tag lms-estimulo-lambda:ci \
            .

      - name: Inspect AWS Lambda image contract
        shell: bash
        run: |
          set -euo pipefail
          image_env="$(docker image inspect lms-estimulo-lambda:ci --format '{{json .Config.Env}}')"
          grep -q 'PLATFORM_RUNTIME_PROVIDER=aws' <<<"$image_env"
          if grep -q 'NEXT_PUBLIC_SUPABASE' <<<"$image_env"; then
            echo "Lambda runtime image contains Supabase public configuration"
            exit 1
          fi

      - name: Smoke test AWS Lambda web container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name lms-estimulo-lambda-ci \
            --publish 3000:3000 \
            --env NEXT_PUBLIC_APP_URL=https://ci.example.org \
            lms-estimulo-lambda:ci
          trap 'docker logs lms-estimulo-lambda-ci || true; docker rm --force lms-estimulo-lambda-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/live >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "Lambda container did not become live"
              exit 1
            fi
            sleep 1
          done

          readiness_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/health/ready)"
          test "$readiness_status" = "503"
