name: Web CI

on:
  pull_request:
    paths:
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/reproducibility.yml"
      - ".github/dependabot.yml"
      - ".dockerignore"
      - ".env.example"
      - ".node-version"
      - ".nvmrc"
      - ".npmrc"
      - "Dockerfile.lambda"
      - "apps/web/**"
      - "config/**"
      - "docs/architecture/**"
      - "docs/decisions/**"
      - "docs/implementation/**"
      - "docs/operations/**"
      - "infra/aws/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/application/**"
      - "scripts/integrations/**"
      - "scripts/performance/**"
      - "scripts/product/**"
      - "scripts/repository/**"
      - "scripts/runtime/**"
      - "scripts/security/**"
      - "scripts/verification/**"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/migrations/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/reproducibility.yml"
      - ".github/dependabot.yml"
      - ".dockerignore"
      - ".env.example"
      - ".node-version"
      - ".nvmrc"
      - ".npmrc"
      - "Dockerfile.lambda"
      - "apps/web/**"
      - "config/**"
      - "docs/architecture/**"
      - "docs/decisions/**"
      - "docs/implementation/**"
      - "docs/operations/**"
      - "infra/aws/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  PLATFORM_RUNTIME_PROVIDER: supabase
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-key
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
  AUTHENTICATED_RPC_FUNCTION_URL: https://example.supabase.co/functions/v1/authenticated-rpc
  CPF_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  CPF_LOOKUP_HMAC_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=

jobs:
  validate:
    name: Validate hardened web application
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up repository Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"

      - name: Validate dependency lock
        run: npm run validate:dependency-lock

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate installed dependency graph
        run: npm ls --all

      - name: Confirm source remains unchanged
        run: git diff --exit-code

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint versioned source
        run: npm run lint:source

      - name: Validate repository and application contracts
        run: |
          npm run validate:repository
          npm run validate:application-foundation
          npm run validate:platform-contract
          npm run validate:runtime-hardening

      - name: Test application behavior
        run: npm run test:application

      - name: Test product rules
        run: npm run test:product

      - name: Test integration contracts
        run: npm run test:integrations

      - name: Typecheck web application
        run: npm run typecheck:web

      - name: Build Supabase test application
        run: npm run build:web

      - name: Restore generated Next.js declaration
        shell: bash
        run: |
          set -euo pipefail
          git restore -- apps/web/next-env.d.ts
          git diff --exit-code

      - name: Build AWS Lambda container image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --file Dockerfile.lambda \
            --build-arg NEXT_PUBLIC_APP_URL=https://ci.example.org \
            --build-arg SOURCE_VERSION="$GITHUB_SHA" \
            --tag lms-estimulo-lambda:ci \
            .

      - name: Inspect AWS Lambda image contract
        shell: bash
        run: |
          set -euo pipefail
          image_env="$(docker image inspect lms-estimulo-lambda:ci --format '{{json .Config.Env}}')"
          image_user="$(docker image inspect lms-estimulo-lambda:ci --format '{{.Config.User}}')"
          image_revision="$(docker image inspect lms-estimulo-lambda:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          grep -q 'PLATFORM_RUNTIME_PROVIDER=aws' <<<"$image_env"
          test "$image_user" = "10001:10001"
          test "$image_revision" = "$GITHUB_SHA"
          if grep -q 'NEXT_PUBLIC_SUPABASE' <<<"$image_env"; then
            echo "Lambda runtime image contains Supabase public configuration"
            exit 1
          fi

      - name: Prepare security evidence directory
        run: mkdir -p .artifacts

      - name: Scan Lambda image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lms-estimulo-lambda:ci
          format: json
          output: .artifacts/trivy-image.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Smoke and capacity test bounded Lambda web container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name lms-estimulo-lambda-ci \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            --memory 536870912 \
            --memory-swap 536870912 \
            --cpus 1.0 \
            --pids-limit 256 \
            --publish 3000:3000 \
            --env NEXT_PUBLIC_APP_URL=https://ci.example.org \
            lms-estimulo-lambda:ci
          trap 'docker logs lms-estimulo-lambda-ci || true; docker rm --force lms-estimulo-lambda-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/live >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 45 ]]; then
              echo "Lambda container did not become live"
              exit 1
            fi
            sleep 1
          done

          readiness_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/health/ready)"
          test "$readiness_status" = "503"

          HTTP_HARDENING_BASE_URL=http://127.0.0.1:3000 npm run verify:http-hardening

          LOAD_TEST_BASE_URL=http://127.0.0.1:3000 \
          LOAD_TEST_CONCURRENCY=40 \
          LOAD_TEST_DURATION_SECONDS=15 \
          LOAD_TEST_WARMUP_SECONDS=3 \
          LOAD_TEST_MIN_REQUESTS=750 \
          LOAD_TEST_MIN_RPS=50 \
          LOAD_TEST_MAX_ERROR_RATE=0.01 \
          LOAD_TEST_MAX_P95_MS=2000 \
          LOAD_TEST_MAX_P99_MS=5000 \
          npm run test:capacity

          test "$(docker inspect lms-estimulo-lambda-ci --format '{{.RestartCount}}')" = "0"
          test "$(docker inspect lms-estimulo-lambda-ci --format '{{.State.OOMKilled}}')" = "false"
          test "$(docker inspect lms-estimulo-lambda-ci --format '{{.State.Status}}')" = "running"
          docker stats --no-stream --format '{{json .}}' lms-estimulo-lambda-ci > .artifacts/container-stats.json

      - name: Generate immutable release evidence
        shell: bash
        run: |
          set -euo pipefail
          git restore -- apps/web/next-env.d.ts
          git diff --exit-code
          mkdir -p .artifacts
          docker save lms-estimulo-lambda:ci | sha256sum > .artifacts/lambda-image.sha256
          image_id="$(docker image inspect lms-estimulo-lambda:ci --format '{{.Id}}')"
          RELEASE_IMAGE_ID="$image_id" npm run build:release-manifest
          (cd .artifacts && sha256sum --check release-manifest.sha256)

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            .artifacts/release-manifest.json
            .artifacts/release-manifest.sha256
            .artifacts/lambda-image.sha256
            .artifacts/load-test.json
            .artifacts/container-stats.json
            .artifacts/trivy-image.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
