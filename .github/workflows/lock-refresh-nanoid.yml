name: Refresh nanoid lock

on:
  push:
    branches:
      - fix/consolidated-audit-remediation
    paths:
      - ".github/workflows/lock-refresh-nanoid.yml"

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh nanoid security patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.8"

      - name: Refresh only nanoid in lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm update nanoid --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const lock=require('./package-lock.json'); if (lock.packages?.['node_modules/nanoid']?.version !== '3.3.17') { throw new Error('nanoid lock did not resolve to 3.3.17') }"
          test "$(git diff --name-only)" = "package-lock.json"

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): update nanoid security patch"
          git push origin HEAD:fix/consolidated-audit-remediation
