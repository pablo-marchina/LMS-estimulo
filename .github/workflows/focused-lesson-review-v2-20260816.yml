name: Focused lesson review v2 2026-08-16

on:
  push:
    branches: [main]
    paths: [.github/workflows/focused-lesson-review-v2-20260816.yml]

permissions:
  contents: read

jobs:
  lesson-production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      E2E_PRODUCTION_URL: ${{ secrets.E2E_PRODUCTION_URL }}
      E2E_PARTICIPANT_EMAIL: ${{ secrets.E2E_PARTICIPANT_EMAIL }}
      E2E_PARTICIPANT_PASSWORD: ${{ secrets.E2E_PARTICIPANT_PASSWORD }}
      E2E_ADMIN_EMAIL: audit-admin-20260813@estimulo.org
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Exercise real journey and lesson actions
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const base = process.env.E2E_PRODUCTION_URL.replace(/\/$/, '');
          const out = path.resolve('artifacts/focused-final-review-v2');
          await mkdir(out, { recursive: true });
          const report = { startedAt:new Date().toISOString(), checks:{}, failures:[], warnings:[] };
          const fail = (m) => report.failures.push(m);
          const browser = await chromium.launch({ headless:true });
          async function login(page,email,password,target) {
            await page.goto(`${base}/entrar`, {waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('input[name="email"]').fill(email);
            await page.locator('input[name="password"]').fill(password);
            await page.locator('button[type="submit"]').click();
            await page.waitForURL(u => u.pathname !== '/entrar', {timeout:30000});
            await page.goto(`${base}${target}`, {waitUntil:'domcontentloaded',timeout:60000});
          }
          try {
            const ctx = await browser.newContext({viewport:{width:1440,height:1000}});
            const page = await ctx.newPage();
            const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(e.message));
            await login(page,process.env.E2E_PARTICIPANT_EMAIL,process.env.E2E_PARTICIPANT_PASSWORD,'/empreendedor/jornadas');

            let journeyOpened=false;
            const enrolledForm=page.locator('form:has(input[name="journey_instance_id"])').first();
            if (await enrolledForm.count()) {
              await enrolledForm.locator('button[type="submit"]').click();
              await page.waitForURL(u=>u.pathname.startsWith('/empreendedor/jornada/'),{timeout:45000});
              journeyOpened=true;
            } else {
              const completedLink=page.locator('a[href^="/empreendedor/jornada/"]').first();
              if (await completedLink.count()) {
                await completedLink.click();
                await page.waitForURL(u=>u.pathname.startsWith('/empreendedor/jornada/'),{timeout:45000});
                journeyOpened=true;
              }
            }
            report.checks.journeyOpened=journeyOpened;
            if (!journeyOpened) throw new Error('No enrolled/completed journey could be opened');

            const forms=page.locator('form:has(input[name="step_instance_id"]):has(button:not([disabled]))');
            report.checks.openableLessons=await forms.count();
            if (!report.checks.openableLessons) throw new Error('Journey has no openable lesson');
            const t0=Date.now();
            await forms.first().locator('button[type="submit"]').click();
            await page.waitForURL(u=>u.searchParams.has('conteudo'),{timeout:45000});
            await page.locator('#aula #conteudo').waitFor({state:'visible',timeout:45000});
            report.checks.lessonOpenMs=Date.now()-t0;
            const lessonUrl=page.url();
            const lesson=page.locator('#aula');
            const text=await lesson.innerText();
            Object.assign(report.checks,{
              hasCompletionCta:/Marcar como concluída|Aula concluída/u.test(text),
              hasRatingPrompt:/O que achou desta aula\?|Obrigado pela avaliação!/u.test(text),
              hasComments:/Converse sobre esta aula/u.test(text),
              duplicateChrome:/(^|\n)Conteúdo aberto(\n|$)/u.test(text),
              stars:await lesson.locator('button[aria-label^="Avaliar com "]').count(),
              commentTextareas:await lesson.locator('textarea[name="body"]').count(),
              driveFrames:await lesson.locator('iframe[src*="drive.google.com/file/d/"][src*="/preview"]').count(),
              desktopOverflow:await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2),
            });
            if(!report.checks.hasCompletionCta) fail('completion CTA missing');
            if(!report.checks.hasRatingPrompt||report.checks.stars!==5) fail('five-star rating missing');
            if(!report.checks.hasComments||report.checks.commentTextareas!==1) fail('inline comments missing');
            if(report.checks.duplicateChrome) fail('duplicate Conteúdo aberto chrome visible');
            if(report.checks.desktopOverflow) fail('desktop overflow');
            await page.screenshot({path:path.join(out,'lesson-desktop.png'),fullPage:true});

            const four=lesson.locator('button[aria-label="Avaliar com 4 estrelas"]');
            await four.click();
            await page.waitForURL(u=>u.searchParams.get('utilidade')==='registrada',{timeout:30000});
            report.checks.ratingPersisted=/Obrigado pela avaliação!|Avaliação registrada/u.test(await page.locator('#aula').innerText());
            if(!report.checks.ratingPersisted) fail('rating did not persist');

            const comment=`Auditoria final Vanessa ${Date.now()}`;
            await page.locator('#aula textarea[name="body"]').fill(comment);
            await page.locator('#aula').getByRole('button',{name:'Publicar'}).click();
            await page.getByText(comment,{exact:true}).waitFor({state:'visible',timeout:30000});
            report.checks.commentPublishedInline=true;

            const complete=page.locator('#aula form#concluir-aula button[type="submit"]');
            if(await complete.count() && !(await complete.isDisabled())) {
              await complete.click();
              await page.waitForURL(u=>u.searchParams.has('conclusao'),{timeout:30000});
              report.checks.completionResult=new URL(page.url()).searchParams.get('conclusao');
              if(report.checks.completionResult==='falha') fail('completion returned generic failure');
            } else report.checks.completionResult='already_completed';

            await page.setViewportSize({width:390,height:844});
            await page.goto(lessonUrl,{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('#aula #conteudo').waitFor({state:'visible',timeout:30000});
            report.checks.mobileOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
            if(report.checks.mobileOverflow) fail('mobile overflow');
            await page.screenshot({path:path.join(out,'lesson-mobile.png'),fullPage:true});
            report.checks.pageErrors=pageErrors.length;
            if(pageErrors.length) fail(`${pageErrors.length} uncaught participant page error(s)`);
            await ctx.close();

            const admin=await browser.newContext({viewport:{width:1440,height:1000}});
            const ap=await admin.newPage();
            await login(ap,process.env.E2E_ADMIN_EMAIL,process.env.E2E_ADMIN_PASSWORD,'/admin/gamificacao');
            const adminText=await ap.locator('body').innerText();
            report.checks.invalidObjectiveRuleVisible=/Escolher um objetivo de aplicação/u.test(adminText);
            if(report.checks.invalidObjectiveRuleVisible) fail('retired application objective rule visible');
            await ap.screenshot({path:path.join(out,'admin-gamificacao.png'),fullPage:true});
            await admin.close();
          } catch(e) { fail(e instanceof Error?e.message:String(e)); }
          finally { await browser.close(); }
          report.finishedAt=new Date().toISOString();
          await writeFile(path.join(out,'focused-report.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          if(report.failures.length) process.exit(1);
          NODE
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: focused-final-review-v2-${{ github.run_id }}
          path: artifacts/focused-final-review-v2
          if-no-files-found: error
          retention-days: 14
