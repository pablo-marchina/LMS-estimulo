name: Fix historical migration temporary

on:
  push:
    branches:
      - fix/platform-content-progress-certificates
    paths:
      - .github/workflows/fix-historical-migration-temporary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair invalid top-level PL/pgSQL statement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260731180000_admin_delivery_and_journey_corrections.sql')
          content = path.read_text()
          old = "perform set_config('app.admin_live_edit','on',true);\nupdate catalog.activity_versions"
          new = "select set_config('app.admin_live_edit','on',true);\nupdate catalog.activity_versions"
          if content.count(old) != 1:
              raise SystemExit(f'expected exactly one historical statement, found {content.count(old)}')
          path.write_text(content.replace(old, new, 1))
          PY
          git rm .github/workflows/fix-historical-migration-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260731180000_admin_delivery_and_journey_corrections.sql
          git commit -m "fix(database): repair historical migration replay syntax"
          git push origin HEAD:fix/platform-content-progress-certificates
