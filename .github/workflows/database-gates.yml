name: Database gates

on:
  pull_request:
    paths:
      - ".github/workflows/database-gates.yml"
      - "package.json"
      - "apps/web/lib/journey-runtime/rpc.ts"
      - "apps/web/lib/practice/**"
      - "apps/web/lib/credentials/**"
      - "apps/web/lib/library/**"
      - "docs/implementation/public-rpc-contracts-v1.json"
      - "scripts/database/**"
      - "supabase/canonical-migrations/**"
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: database-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay and verify database behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_HOST: /var/run/postgresql
          PGPORT: 5432
          POSTGRES_PORT: 5432
          PGPASSWORD: postgres
          POSTGRES_PASSWORD: postgres
          PGDATABASE: postgres
          POSTGRES_DB: postgres
          JWT_SECRET: local-replay-jwt-secret-with-at-least-thirty-two-characters
          JWT_EXP: 3600
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost -p 5432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Confirm database version and extensions
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "select version();"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "select name, default_version from pg_available_extensions where name in ('pgcrypto','pg_cron','pg_net','supabase_vault') order by name;"

      - name: Run database gates
        id: database_gates
        shell: bash
        run: |
          set +e
          mkdir -p .artifacts
          npm run test:database > .artifacts/database-gates.log 2>&1
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [[ "$exit_code" -eq 0 ]]; then
            cat .artifacts/database-gates.log
            rm -f .artifacts/database-gates.log
          else
            tail -n 260 .artifacts/database-gates.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload database gate diagnostics
        if: steps.database_gates.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: database-gates-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/database-gates.log
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: Fail when a database gate fails
        if: steps.database_gates.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "A database gate failed. Inspect the uploaded diagnostic artifact."
          exit 1
