schema_version: 0.1
status: draft
purpose:
  allowed:
    - journey_personalization
    - support_intensity
    - intervention_research
    - longitudinal_measurement
  prohibited:
    - automatic_credit_decision
    - credit_pricing
    - moral_or_honesty_inference
components:
  core_behavioral_profile:
    dimensions:
      - planning_to_action
      - information_and_control_routines
      - execution_and_self_regulation
      - persistence_and_recovery
      - applied_learning
      - support_seeking_and_feedback_use
      - digital_experimentation
      - verification_and_confidence_calibration
  contextual_snapshot:
    fields:
      - business_maturity
      - credit_moment
      - current_urgency
      - time_availability
      - device_access
      - connectivity
      - operating_structure
  journey_readiness:
    journey_code: ai_for_small_business
    fields:
      - prior_ai_use
      - priority_use_case
      - tool_access
      - voice_text_file_ability
      - sensitive_data_awareness
      - output_verification_practice
research:
  qualitative_interviews:
    minimum: 8
    target_range: [12, 16]
    duration_minutes: [45, 60]
  cognitive_interviews:
    target_range: [5, 8]
  quantitative_validation:
    sample_size: power_or_condition_based
    force_four_profiles: false
classification:
  output:
    - archetype_model_version
    - archetype_id
    - posterior_probability
    - second_best_archetype_id
    - second_best_probability
    - confidence
    - classified_at
    - valid_until
    - instrument_version
  allow_uncertain: true
  preserve_history: true
fairness:
  demographics_as_initial_predictors: false
  evaluate:
    - item_comprehension
    - differential_item_functioning
    - uncertain_classification_rate
    - intervention_exposure
    - outcome_differences
