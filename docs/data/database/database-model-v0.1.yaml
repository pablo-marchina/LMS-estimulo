version: '0.1'
date: '2026-07-08'
status: logical_and_preliminary_physical_baseline
database: PostgreSQL-compatible relational model; managed provider decided in E12
schemas:
  iam: Contas autenticáveis, organizações operadoras, papéis, capacidades e vínculos
    internos.
  core: Empreendedores, negócios beneficiários, vínculos e arquivos protegidos.
  catalog: Programas, definições e versões publicáveis de jornadas, cursos, atividades
    e competências.
  orchestration: Regras, trilhas, inscrições, instâncias, passos e projeções de execução.
  diagnostics: Instrumentos, respostas, resultados, segmentos operacionais e arquétipos
    futuros.
  assessment: Avaliações, tentativas, práticas, evidências e revisões.
  engagement: Pontos, selos, sequências e certificados.
  intervention: Definições, regras, instâncias e entregas de intervenções.
  eventing: Schemas de eventos, log canônico, outbox, inbox, entregas e dead letters.
  integration: Conexões, mapeamentos, webhooks, sincronizações, conflitos e reconciliação.
  intelligence: Features comportamentais, execuções, scores experimentais, explicações
    e validações.
  governance: Consentimentos, solicitações de privacidade, retenção, linhagem, aprovações
    e auditoria.
  reporting: Views e projeções de leitura; não contém fatos primários.
tables:
- schema: iam
  name: user_accounts
  description: Conta autenticável desacoplada da pessoa de negócio.
  primary_key: id
  columns:
  - id uuid
  - auth_provider text
  - auth_subject text
  - email_normalized text
  - status text
  - last_authenticated_at timestamptz nullable
  - created_at timestamptz
  - updated_at timestamptz
  foreign_keys: []
  unique_constraints:
  - auth_provider, auth_subject
  - email_normalized
  source_of_truth: operational
  append_only: false
- schema: iam
  name: organizations
  description: Estímulo, parceiros, produtores de conteúdo e outras organizações operadoras.
