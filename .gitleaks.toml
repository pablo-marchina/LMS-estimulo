title = "Plataforma Estímulo secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic CI-only placeholders verified in historical workflows"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''^\s*(?:NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)\s*[:=]\s*(?:ci-placeholder-(?:key|anon-key|public-key|service-key)|browser-e2e-(?:anon-key|service-role-key)|test-(?:anon-key|service-role-key))\s*$''',
  '''^\s*CPF_ENCRYPTION_KEY\s*[:=]\s*MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=\s*$''',
  '''^\s*CPF_LOOKUP_HMAC_KEY\s*[:=]\s*ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=\s*$''',
]

[[allowlists]]
description = "Supabase publishable keys are intentionally public; limit this exception to the historical one-shot migration workflow"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^\.github/workflows/migrate-lesson-videos\.yml$''']
regexes = ['''^\s*SUPABASE_PUBLISHABLE_KEY\s*:\s*sb_publishable_[A-Za-z0-9_]+\s*$''']

[[allowlists]]
description = "PR 269 browser audit uses the production project's client-visible Supabase publishable key"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^\.github/workflows/pr-269-visual-approval\.yml$''']
regexes = ['''^\s*NEXT_PUBLIC_SUPABASE_ANON_KEY\s*:\s*sb_publishable_[A-Za-z0-9_]+\s*$''']
