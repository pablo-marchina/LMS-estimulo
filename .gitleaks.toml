title = "Plataforma Estímulo secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic CI-only Supabase placeholders verified in historical workflows"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^ci-placeholder-(?:key|anon-key|public-key|service-key)$''',
  '''^browser-e2e-(?:anon-key|service-role-key)$''',
  '''^test-(?:anon-key|service-role-key)$''',
]
